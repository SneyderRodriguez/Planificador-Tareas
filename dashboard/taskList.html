<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=group" />
    <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Thyra | Lista Tareas</title>
    <script src="../js/components.js"></script>
</head>

<body>
    <main>
        <div id="aside-container"></div>
        <!-- Contenido principal -->
        <section class="contenedor">
            <!-- TÍTULO -->
            <div class="title">
                <h1>Tareas</h1>
            </div>
            <!-- FILTROS -->
            <div class="task-filters">
                <select class="form-select" id="filter-category" aria-label="Filtrar por categoría">
                    <option value="">Categoría</option>
                </select>
                <select class="form-select" id="filter-priority" aria-label="Filtrar por prioridad">
                    <option value="">Prioridad</option>
                </select>
                <select class="form-select" id="filter-status" aria-label="Filtrar por estado">
                    <option value="">Estado</option>
                </select>
            </div>
            <!-- LISTA DE TAREAS -->
            <div class="to-do-list">
                <ul id="task-list" class="list-group">
                </ul>
            </div>
        </section>
    </main>
    <script src="js/taskManager.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
