<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=group" />
    <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>Planificador | Tareas</title>
</head>

<body>
    <main>
        <aside>
            <div class="perfil">
                <a href="#">
                    <span class="material-symbols-outlined">
                        group
                    </span>
                </a>
            </div>
            <button class="task-create" type="">Crear Tarea</button>
            <button class="task-list" type="">Tareas</button>
        </aside>
        <div class="contenedor">
            <div class="title">
                <h1>Crear Tarea</h1>
            </div>
            <div class="paneles">
                <!-- PANEL IZQUIERDO -->
                <form class="task-form" id="task-form">
                    <!-- NOMBRE DE LA TAREA -->
                    <div class="mb-3">
                        <input type="text" class="form-control" id="task-name" placeholder="Título de la Tarea">
                    </div>
                    <div class="checkbox">
                        <!-- CATEGORIA -->
                        <select class="form-select categoria" id="task-category" aria-label="Default select example">
                            <option value="" selected disabled>Categoria</option>
                            <option value="estudio">Estudio</option>
                            <option value="trabajo">Trabajo</option>
                            <option value="hogar">Hogar</option>
                        </select>
                        <!-- PRIORIDAD -->
                        <select class="form-select prioridad" id="task-priority" aria-label="Size 3 select example">
                            <option value="" selected disabled>Prioridad</option>
                            <option value="1">Baja</option>
                            <option value="2">Media</option>
                            <option value="3">Alta</option>
                        </select>
                    </div>
                    <!-- DESCRIPCION DE LA TAREA -->
                    <div class="mb-3" id="task-text">
                        <textarea class="form-control task-text" id="task-description"
                            placeholder="Descripción"></textarea>
                    </div>
                    <div class="form-bottom">
                        <!-- FECHAS -->
                        <input type="date" class="form-control" id="task-start-date">
                        <input type="date" class="form-control" id="task-end-date">
                        <!-- AGREGAR TAREA -->
                        <input class="btn btn-primary" type="submit" value="Submit">
                    </div>
                </form>
                <!-- PANEL DERECHO -->
                <div class="to-do-list">
                    <!-- LISTA DE TAREAS -->
                    <ul id="task-list" class="list-group">
                    </ul>
                </div>
            </div>
        </div>
    </main>
    <div class="modal fade" id="task-details-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalles de la tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <strong>Nombre</strong>
                        <p id="modal-task-name"></p>
                    </div>
                    <div class="mb-3">
                        <strong>Descripción</strong>
                        <p id="modal-task-description"></p>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <strong>Categoría</strong>
                            <p id="modal-task-category"></p>
                        </div>
                        <div class="col-6">
                            <strong>Prioridad</strong>
                            <p id="modal-task-priority"></p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <strong>Fecha inicio</strong>
                            <p id="modal-task-start-date"></p>
                        </div>
                        <div class="col-6">
                            <strong>Fecha fin</strong>
                            <p id="modal-task-end-date"></p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <strong>Estado</strong>
                        <p id="modal-task-status"></p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/taskManager.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
